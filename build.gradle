buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

version = '1.0.0'
group = 'ru.modminecraft.toolmerge'
archivesBaseName = 'toolmerge'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client {
            workingDirectory project.file('run')
            mods {
                toolmerge { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            mods {
                toolmerge { source sourceSets.main }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Specification-Title': 'toolmerge',
                   'Specification-Version': '1',
                   'Implementation-Title': 'Tool Merge',
                   'Implementation-Version': project.version
    }
}
jar.finalizedBy('reobfJar')
